<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CREATURE // DARK LAB</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-cyber">

  <!-- ELECTRON DRAG REGION -->
  <div id="drag-region"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 30px; -webkit-app-region: drag; z-index: 99999; pointer-events: none;">
  </div>
  <!-- Note: pointer-events: none allows clicking THROUGH the drag region to buttons below, 
         but technically 'drag' usually requires catching events. 
         Electron is tricky here. 
         Better approach: make width smaller or use specific CSS on buttons to be 'no-drag'.
         Let's stick to user request but ensure it doesn't block. 
         Actually, if I use pointer-events: none, drag might not work.
         Lets use the user's exact CSS but make it shorter width to avoid top-right buttons. -->

  <!-- REPLACING THE ABOVE COMMENT WITH ACTUAL CODE -->
  <div id="drag-region"
    style="position: fixed; top: 0; left: 0; width: calc(100% - 120px); height: 30px; -webkit-app-region: drag; z-index: 99999;">
  </div>

  <div id="mini-exit-btn" title="EXIT MINI MODE">✕</div>

  <div id="start-screen">
    <div class="boot-container">
      <button id="force-start-btn">
        <div class="btn-glow"></div>
        <span class="btn-text">INITIALIZE SYSTEM</span>
      </button>
      <p class="boot-sub">USER INTERACTION REQUIRED FOR MEDIA ACCESS</p>
    </div>
  </div>

  <button id="mini-restore-btn" class="mini-restore-btn">⤢</button>

  <div id="ui-layer">

    <div class="hud-corner top-left">
      ANTI_VIBE // V.4.1<br> SYS.STATUS: <span id="sys-status">STANDBY</span>
    </div>
    <div class="hud-corner top-right">
      <div id="hud-audio" class="hud-item">AUDIO: MUTED</div>
      <div id="hud-cam" class="hud-item">CAM: STANDBY</div>
    </div>

    <div class="crosshair"></div>

    <div id="controls-panel" class="glass-panel">
      <div class="panel-header">
        <span class="header-title">VIBE CONSOLE v4.1</span>
        <button id="btn-collapse" class="icon-btn" title="COLLAPSE">[ - ]</button>
      </div>

      <div id="panel-content">

        <fieldset class="control-group">
          <legend>SENSORS</legend>
          <div class="button-row">
            <button id="btn-vision" class="toggle-btn active">VISION: ON</button>
            <button id="btn-mic" class="toggle-btn">MIC: OFF</button>
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>FOCUS GOAL</legend>
          <div class="mode-switch">
            <button id="focus-screen" class="mode-btn active">💻 SCREEN</button>
            <button id="focus-reality" class="mode-btn">📖 REALITY</button>
          </div>
          <div id="focus-desc" style="font-size: 9px; opacity:0.6; text-align: center; margin-top: 5px;">
            Keep eyes on screen to stabilize.
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>MODE</legend>
          <div class="mode-switch">
            <button id="mode-fluid" class="mode-btn active">FLUID</button>
            <button id="mode-pixel" class="mode-btn">PIXEL</button>
          </div>

          <div id="controls-fluid" class="mode-content">
            <label>COLOR</label>
            <div class="color-wrapper">
              <input type="color" id="fluid-color" value="#00ff41">
            </div>
          </div>

          <div id="controls-pixel" class="mode-content" style="display:none;">
            <label>EFFECT</label>
            <select id="effect-select">
              <option value="WANDERING">WANDERING</option>
              <option value="NEBULA">NEBULA</option>
              <option value="VORTEX">VORTEX</option>
              <option value="GLITCH">GLITCH</option>
              <option value="EXPLODE">EXPLODE</option>
            </select>

            <label>IMAGE UPLOAD</label>
            <label for="img-upload" class="file-upload-btn">[ SELECT IMAGE ]</label>
            <input type="file" id="img-upload" accept="image/*">
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>TWEAKS</legend>
          <label>THEME</label>
          <select id="theme-select">
            <option value="CYBER">Cyberpunk (Default)</option>
            <option value="ZEN">Zen White</option>
            <option value="SEA">Deep Sea</option>
          </select>

          <label>PARTICLE SIZE</label>
          <input type="range" id="particle-size" min="100" max="400" value="200">
        </fieldset>

        <fieldset class="control-group">
          <legend>QUICK SLOTS</legend>
          <div class="preset-row">
            <button id="slot-1" class="preset-btn" title="Zen Fluid">I</button>
            <button id="slot-2" class="preset-btn" title="Matrix Glitch">II</button>
            <button id="slot-3" class="preset-btn" title="Abyss Fluid">III</button>
          </div>
        </fieldset>

        <div class="panel-footer-tools"
          style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
          <button id="btn-mini-mode" class="toggle-btn" style="width: 100%; border-style: dashed;">⤢ HIDE UI
            (MINI)</button>
        </div>

        <button id="btn-reset" class="reset-btn">// FACTORY RESET</button>
      </div>
    </div>

    <div id="quote-container">
      <div id="quote-text"></div>
    </div>

  </div>

  <div id="vision-root" style="display:none;">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <script type="module" src="js/vision.js"></script>
  <script src="js/sketch.js"></script>
</body>

</html>
